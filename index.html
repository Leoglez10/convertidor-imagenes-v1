<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Imágenes Pro</title>
    <!-- Incluir JSZip para empaquetar múltiples imágenes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #0f172a;
            --primary-hover: #334155;
            --accent: #3b82f6;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .converter-box {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            width: 100%;
            max-width: 480px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        /* Tabs Styling */
        .tabs {
            display: flex;
            background: #e2e8f0;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 1.5rem;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
        }

        .tab.active {
            background: var(--surface);
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Dropzone Styling */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 1.5rem;
            transition: var(--transition);
            background-color: #fafafa;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background-color: #eff6ff;
        }

        .drop-zone>p {
            margin: 0;
            color: var(--text-muted);
            font-weight: 500;
            pointer-events: none;
        }

        .drop-zone p span {
            color: var(--accent);
            font-weight: 600;
        }

        .actions-row {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            justify-content: center;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .hidden-input {
            display: none;
        }

        /* Preview Image */
        .preview-container {
            width: 100%;
            height: 0;
            overflow: hidden;
            transition: height 0.4s ease;
            position: relative;
        }

        .preview-container.active {
            height: 180px;
            margin-bottom: 1.5rem;
        }

        #preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #preview.loaded {
            opacity: 1;
        }

        .count-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.8);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        /* Controles */
        .controls {
            display: flex;
            gap: 1rem;
            flex-direction: column;
        }

        select {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: var(--surface);
            cursor: pointer;
            outline: none;
            transition: var(--transition);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .bg-info-text {
            display: none;
            color: var(--accent);
            font-size: 0.95rem;
            font-weight: 600;
            background-color: #eff6ff;
            padding: 0.875rem;
            border-radius: 10px;
            border: 1px solid #bfdbfe;
        }

        button.btn-primary {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
            transform: translateY(0);
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        button.btn-primary:active {
            transform: translateY(0);
        }

        button.btn-primary:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.2s ease;
        }

        footer {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        footer p { margin: 0.2rem; }
    </style>
</head>

<body>

    <div class="converter-box">
        <h2>Transforma</h2>
        <p class="subtitle">Formatos locales. Cero servidores. Múltiples a la vez.</p>

        <!-- Tabs de Navegación -->
        <div class="tabs">
            <div class="tab active" id="tab-convert">Convertir Formato</div>
            <div class="tab" id="tab-bg">✨ Quitar Fondo (IA)</div>
        </div>

        <div class="drop-zone" id="dropZone">
            <p id="dropZoneText">Arrastra imágenes/carpetas aquí</p>
            <div class="actions-row">
                <button type="button" class="btn-secondary"
                    onclick="document.getElementById('imageInput').click()">Archivos</button>
                <button type="button" class="btn-secondary"
                    onclick="document.getElementById('folderInput').click()">Carpeta</button>
            </div>
            <input type="file" class="hidden-input" id="imageInput" accept="image/png, image/jpeg, image/webp" multiple>
            <input type="file" class="hidden-input" id="folderInput" webkitdirectory directory multiple>
        </div>

        <div class="preview-container" id="previewContainer">
            <img id="preview" alt="Vista previa">
            <span class="count-badge" id="countBadge" style="display:none;">1 archivo</span>
        </div>

        <div class="controls">
            <!-- Select solo visible en modo Conversión -->
            <select id="formatSelect">
                <option value="image/webp">Convertir a WebP</option>
                <option value="image/jpeg">Convertir a JPEG</option>
                <option value="image/png">Convertir a PNG</option>
            </select>

            <!-- Texto solo visible en modo Quitar Fondo -->
            <div class="bg-info-text" id="bgInfoText">
                Se guardará automáticamente en PNG para mantener la transparencia.
            </div>

            <button class="btn-primary" id="convertBtn" disabled>Convertir Imagen</button>
            
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <footer>
            <p>Creado por Leonardo González</p>
            <p>Todos los derechos reservados &copy; 2026</p>
        </footer>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const imageInput = document.getElementById('imageInput');
        const folderInput = document.getElementById('folderInput');

        const tabConvert = document.getElementById('tab-convert');
        const tabBg = document.getElementById('tab-bg');
        const formatSelect = document.getElementById('formatSelect');
        const bgInfoText = document.getElementById('bgInfoText');

        const convertBtn = document.getElementById('convertBtn');
        const previewContainer = document.getElementById('previewContainer');
        const preview = document.getElementById('preview');
        const countBadge = document.getElementById('countBadge');
        const dropZoneText = document.getElementById('dropZoneText');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let imageFilesList = [];
        let currentMode = 'convert'; // 'convert' o 'bg'

        // --- SISTEMA DE TABS ---
        tabConvert.addEventListener('click', () => {
            currentMode = 'convert';
            tabConvert.classList.add('active');
            tabBg.classList.remove('active');
            formatSelect.style.display = 'block';
            bgInfoText.style.display = 'none';
            updateBtnText();
        });

        tabBg.addEventListener('click', () => {
            currentMode = 'bg';
            tabBg.classList.add('active');
            tabConvert.classList.remove('active');
            formatSelect.style.display = 'none';
            bgInfoText.style.display = 'block';
            updateBtnText();
        });

        function updateBtnText() {
            if (imageFilesList.length === 0) {
                convertBtn.innerText = currentMode === 'bg' ? 'Quitar Fondo' : 'Convertir Imagen';
                return;
            }
            const total = imageFilesList.length;
            if (currentMode === 'bg') {
                convertBtn.innerText = total > 1 ? `Quitar fondo a Lote (${total})` : "Quitar Fondo a Imagen";
            } else {
                convertBtn.innerText = total > 1 ? `Convertir Lote (${total})` : "Convertir Imagen";
            }
        }

        // --- Drag & Drop ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', async (e) => {
            const items = e.dataTransfer.items;
            if (!items) return;

            dropZoneText.innerHTML = "Procesando archivos...";
            convertBtn.disabled = true;

            const filesToProcess = [];
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (item.kind === 'file') {
                    const entry = item.webkitGetAsEntry();
                    if (entry) {
                        try {
                            const extractedFiles = await scanEntry(entry);
                            filesToProcess.push(...extractedFiles);
                        } catch (err) {
                            console.error(err);
                        }
                    }
                }
            }
            processCollectedFiles(filesToProcess);
        });

        async function scanEntry(entry) {
            return new Promise((resolve, reject) => {
                if (entry.isFile) {
                    entry.file(file => {
                        resolve(isValidImage(file) ? [file] : []);
                    }, reject);
                } else if (entry.isDirectory) {
                    const dirReader = entry.createReader();
                    const results = [];

                    const readEntries = () => {
                        dirReader.readEntries(async (entries) => {
                            if (entries.length === 0) {
                                resolve(results);
                            } else {
                                const promises = entries.map(e => scanEntry(e));
                                const filesArrays = await Promise.all(promises);
                                filesArrays.forEach(arr => results.push(...arr));
                                readEntries();
                            }
                        }, reject);
                    };
                    readEntries();
                } else {
                    resolve([]);
                }
            });
        }

        imageInput.addEventListener('change', function () {
            processCollectedFiles(Array.from(this.files).filter(isValidImage));
        });

        folderInput.addEventListener('change', function () {
            processCollectedFiles(Array.from(this.files).filter(isValidImage));
        });

        function isValidImage(file) {
            return file.type.startsWith('image/');
        }

        function processCollectedFiles(files) {
            if (files.length === 0) {
                dropZoneText.innerHTML = "No se encontraron imágenes válidas.";
                imageFilesList = [];
                convertBtn.disabled = true;
                return;
            }

            imageFilesList = files;
            const firstFile = files[0];

            const objectURL = URL.createObjectURL(firstFile);
            preview.onload = () => {
                previewContainer.classList.add('active');
                setTimeout(() => preview.classList.add('loaded'), 100);
            };
            preview.src = objectURL;

            countBadge.style.display = 'block';
            countBadge.innerHTML = `${files.length} archivo${files.length > 1 ? 's' : ''}`;

            if (files.length === 1) {
                dropZoneText.innerHTML = `Lista: <span>${firstFile.name}</span>`;
            } else {
                dropZoneText.innerHTML = `Imágenes cargadas: <span>${files.length}</span>`;
            }

            convertBtn.disabled = false;
            updateBtnText();
        }

        // --- Lógica de Procesamiento ---
        convertBtn.addEventListener('click', async () => {
            if (imageFilesList.length === 0) return;

            convertBtn.disabled = true;
            progressBar.classList.add('active');
            progressFill.style.width = '0%';

            const total = imageFilesList.length;
            // Si estamos en modo BG, forzamos PNG para preservar canal alfa
            const format = currentMode === 'bg' ? 'image/png' : formatSelect.value;
            const extension = format.split('/')[1];
            const useAI = currentMode === 'bg';

            try {
                // Si usa IA, importamos la librería dinámicamente
                let removeBgFunc = null;
                if (useAI) {
                    convertBtn.innerText = "Cargando Motor IA...";
                    const imglyModule = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
                    removeBgFunc = imglyModule.removeBackground;
                    
                    if (!removeBgFunc) {
                        throw new Error("No se pudo importar la función removeBackground. Revisa la red.");
                    }
                }

                if (total === 1) {
                    if (useAI) convertBtn.innerText = "Aplicando IA (Puede tardar un momento)...";
                    else convertBtn.innerText = "Procesando...";
                    
                    const dataUrl = await convertSingleFile(imageFilesList[0], format, useAI, removeBgFunc);
                    
                    // Nombres de archivos listos
                    let suffix = useAI ? '-sinfondo' : '-convertida';
                    let originalName = imageFilesList[0].name;
                    let baseName = originalName.substring(0, originalName.lastIndexOf('.'));
                    downloadLink(dataUrl, `${baseName}${suffix}.${extension}`);

                    progressFill.style.width = '100%';
                    setTimeout(() => resetBtn(total), 1000);
                } else {
                    convertBtn.innerText = "Preparando ZIP...";
                    const zip = new JSZip();

                    for (let i = 0; i < total; i++) {
                        const file = imageFilesList[i];
                        if (useAI) convertBtn.innerText = `Borrando fondo ${i + 1}/${total}...`;
                        else convertBtn.innerText = `Convirtiendo ${i + 1}/${total}`;
                        
                        const dataUrl = await convertSingleFile(file, format, useAI, removeBgFunc);

                        const base64Data = dataUrl.split(',')[1];
                        let originalName = file.name;
                        let baseName = originalName.substring(0, originalName.lastIndexOf('.'));
                        let suffix = useAI ? '-sinfondo' : '';
                        
                        const newName = `${baseName}${suffix}.${extension}`;
                        zip.file(newName, base64Data, { base64: true });

                        progressFill.style.width = `${((i + 1) / total) * 100}%`;
                    }

                    convertBtn.innerText = "Comprimiendo recursos...";
                    const zipBlob = await zip.generateAsync({ type: "blob" });
                    
                    let suffixZip = useAI ? 'sinfondo' : 'convertido';
                    downloadLink(URL.createObjectURL(zipBlob), `lote-${suffixZip}-${Date.now()}.zip`);

                    setTimeout(() => resetBtn(total), 1000);
                }
            } catch (error) {
                console.error("Error global:", error);
                alert("Ocurrió un error. \n\nMotivo: " + error.message);
                resetBtn(total);
            }
        });

        async function convertSingleFile(file, targetFormat, useAI, removeBgFunc) {
            let srcBlob = file;
            if (useAI && removeBgFunc) {
                try {
                    // Esperar el modelo y borrar el fondo directamente. 
                    // Convertimos a Object URL para asegurar máxima compatibilidad con la librería IMGLY.
                    const objectUrl = URL.createObjectURL(file);
                    
                    // Configuramos el progreso para que el usuario no sienta que se congeló
                    const config = {
                        progress: (key, current, total) => {
                            if (total && total > 0) {
                                const percent = Math.round((current / total) * 100);
                                convertBtn.innerText = `Descargando IA (${percent}%)...`;
                                progressFill.style.width = `${percent}%`;
                            } else {
                                convertBtn.innerText = `Calculando y borrando fondo...`;
                            }
                        }
                    };

                    srcBlob = await removeBgFunc(objectUrl, config);
                    URL.revokeObjectURL(objectUrl);
                } catch(e) {
                    console.error("Error en IMGLY:", e);
                    throw new Error("Falló la inteligencia artificial al procesar " + file.name + "\n" + e.message);
                }
            }

            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');

                    if (targetFormat === 'image/jpeg') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    ctx.drawImage(img, 0, 0);
                    const dataUrl = canvas.toDataURL(targetFormat, 0.9);
                    URL.revokeObjectURL(img.src);
                    resolve(dataUrl);
                };
                img.onerror = () => reject(new Error("No se pudo cargar la imagen de salida"));
                img.src = URL.createObjectURL(srcBlob);
            });
        }

        function downloadLink(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function resetBtn(total) {
            updateBtnText();
            convertBtn.disabled = false;
            progressBar.classList.remove('active');
        }
    </script>
</body>

</html>
